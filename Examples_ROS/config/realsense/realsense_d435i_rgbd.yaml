%YAML:1.0

# RealSense D435i serial 939622073378, 640x480 at 30 Hz.
# Calibration read from this device with rs-enumerate-devices -c.
# rgbd mode; camera driver is started separately.
File.version: "1.0"
Camera.type: "PinHole"
Camera.width: 640
Camera.height: 480
Camera.fps: 30
Camera.RGB: 1

Camera1.fx: 609.847778320312
Camera1.fy: 608.837707519531
Camera1.cx: 321.284820556641
Camera1.cy: 244.955001831055
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# D435i infrared stereo baseline, also used as the RGB-D virtual baseline.
Stereo.b: 0.0501389801502228
Stereo.ThDepth: 40.0
Camera.bf: 30.5771456518596
ThDepth: 40.0
RGBD.DepthMapFactor: 1000.0
DepthMapFactor: 1000.0

ORBextractor.nFeatures: 1250
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

topics:
  rgb_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
